# Installed as ~/.tmux.conf in WSL.
# One-key controls for phones: Termius has no tap-to-select-pane, but its extra key row has F1..F12, and
# Ctrl+b chords are awkward on a touch keyboard. These work without the Ctrl+b prefix, in every session.
bind -n F1 select-pane -t :.+     # next pane
bind -n F2 resize-pane -Z         # zoom this pane full screen, and back
bind -n F3 next-layout            # side by side / up-down / grid
bind -n F4 detach-client          # leave; everything keeps running

# Scroll back with the finger or wheel where the terminal sends it (Windows Terminal does; Termius may not).
set -g mouse on
